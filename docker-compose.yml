version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices

  nats:
    image: nats:2.10-alpine
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"   # monitoring UI
    command: ["--http_port", "8222"]
    networks:
      - microservices

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_DSN: "root:rootpassword@tcp(mysql:3306)/userdb?charset=utf8mb4&parseTime=True&loc=Local"
      NATS_URL: "nats://nats:4222"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-change-in-production}"
      JWT_EXPIRY_HOURS: "24"
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
    restart: on-failure
    networks:
      - microservices

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      DATABASE_DSN: "root:rootpassword@tcp(mysql:3306)/orderdb?charset=utf8mb4&parseTime=True&loc=Local"
      NATS_URL: "nats://nats:4222"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-change-in-production}"
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
    restart: on-failure
    networks:
      - microservices

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      DATABASE_DSN: "root:rootpassword@tcp(mysql:3306)/notificationdb?charset=utf8mb4&parseTime=True&loc=Local"
      NATS_URL: "nats://nats:4222"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-change-in-production}"
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
    restart: on-failure
    networks:
      - microservices

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - user-service
      - order-service
      - notification-service
    restart: on-failure
    networks:
      - microservices

volumes:
  mysql_data:

networks:
  microservices:
    driver: bridge
