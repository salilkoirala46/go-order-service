server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — re-resolves service names per request
    # instead of caching a stale IP from container start time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_connect_timeout              10s;
    proxy_send_timeout                 30s;
    proxy_read_timeout                 30s;

    # SPA fallback — serves index.html for any path not matched above.
    # Must come first so more-specific /api blocks can override it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/auth[/*]  →  user-service:8080/auth[/*]
    # set $backend MUST come before rewrite; "rewrite ... break" stops all
    # subsequent rewrite-phase directives (including set) that follow it.
    location /api/auth {
        set $backend http://user-service:8080;
        rewrite ^/api/auth(/.*)?$ /auth$1 break;
        proxy_pass $backend;
    }

    # /api/users[/*]  →  user-service:8080/users[/*]
    location /api/users {
        set $backend http://user-service:8080;
        rewrite ^/api/users(/.*)?$ /users$1 break;
        proxy_pass $backend;
    }

    # /api/orders[/*]  →  order-service:8081/orders[/*]
    location /api/orders {
        set $backend http://order-service:8081;
        rewrite ^/api/orders(/.*)?$ /orders$1 break;
        proxy_pass $backend;
    }

    # /api/notifications[/*]  →  notification-service:8082/notifications[/*]
    location /api/notifications {
        set $backend http://notification-service:8082;
        rewrite ^/api/notifications(/.*)?$ /notifications$1 break;
        proxy_pass $backend;
    }
}
